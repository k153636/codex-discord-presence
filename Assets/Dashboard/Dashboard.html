<script>

(function () {
  const registry = {};
  class DCLogic {
    constructor(props) { this.props = props || {}; this.state = {}; }
    setState(patch) {
      this.state = Object.assign({}, this.state, typeof patch === 'function' ? patch(this.state) : patch);
      this.__rerender();
    }
    forceUpdate() { this.__rerender(); }
  }
  window.DCLogic = DCLogic;

  const HOLE = /\{\{\s*([^}]+?)\s*\}\}/g;
  const WHOLE = /^\{\{\s*([^}]+?)\s*\}\}$/;
  function lookup(path, scope) {
    if (path === 'true') return true;
    if (path === 'false') return false;
    if (path === 'null') return null;
    if (/^-?\d+(\.\d+)?$/.test(path)) return Number(path);
    if (/^'.*'$|^".*"$/.test(path)) return path.slice(1, -1);
    return path.split('.').reduce((v, k) => (v == null ? undefined : v[k]), scope);
  }
  function interp(text, scope) {
    return text.replace(HOLE, (_, p) => { const v = lookup(p, scope); return v == null ? '' : String(v); });
  }
  function raw(text, scope) {
    const m = WHOLE.exec(text);
    return m ? lookup(m[1], scope) : interp(text, scope);
  }

  function renderNodes(nodes, scope, ctx, parent) {
    for (const n of nodes) renderNode(n, scope, ctx, parent);
  }
  function renderNode(node, scope, ctx, parent) {
    if (node.nodeType === 3) { parent.appendChild(document.createTextNode(interp(node.nodeValue, scope))); return; }
    if (node.nodeType !== 1) return;
    const tag = node.localName;
    if (tag === 'sc-for') {
      const list = raw(node.getAttribute('list') || '', scope) || [];
      const as = node.getAttribute('as') || 'item';
      list.forEach((item, i) => renderNodes(node.childNodes, Object.assign({}, scope, { [as]: item, $index: i }), ctx, parent));
      return;
    }
    if (tag === 'sc-if') {
      if (raw(node.getAttribute('value') || '', scope)) renderNodes(node.childNodes, scope, ctx, parent);
      return;
    }
    if (tag === 'dc-import') {
      const name = node.getAttribute('name');
      const props = {};
      for (const a of node.attributes) {
        if (a.name === 'name' || a.name.startsWith('hint-')) continue;
        props[a.name.replace(/-([a-z])/g, (_, c) => c.toUpperCase())] = raw(a.value, scope);

        faceStyle: 'display:flex;flex-direction:column;justify-content:center;gap:3px;height:44px;padding:0 8px;border-radius:8px;border:1px solid ' + border + ';background:' + bg + ';' + (live ? 'box-shadow:inset 0 0 0 1px ' + p.color + ';' : ''),
        iconStyle: 'flex:0 0 16px;border-radius:3px;' + (p.pixel ? 'image-rendering:pixelated;' : '') + (on ? '' : 'filter:grayscale(1);opacity:0.55;'),
        nameStyle: 'font-size:12px;line-height:16px;font-weight:600;color:' + (on ? '#EFF1F5' : '#9A9EAB') + ';',
        statusStyle: 'display:flex;align-items:center;gap:4px;font-size:11px;line-height:14px;font-weight:' + (live ? '600' : '400') + ';color:' + (live ? p.tone : on ? '#B1B4BF' : '#8F93A0') + ';'
      };
    });

    const o = P[ownerId];
    const metrics = (o.metrics || []).map((m) => ({
      ...m,
      hasBar: typeof m.pct === 'number',
      barStyle: 'display:block;height:3px;width:' + (m.pct || 0) + '%;background:' + (m.barColor || '#977AFF') + ';'
    }));

    const C = {
      connected: { label: 'Connected', color: '#5CC487', bg: 'rgba(92,196,135,0.12)', bd: 'rgba(92,196,135,0.38)', ringFill: '#5CC487', innerR: 0 },
      connecting: { label: 'Connecting…', color: '#E3B341', bg: 'rgba(227,179,65,0.12)', bd: 'rgba(227,179,65,0.38)', ringFill: 'none', innerR: 1.5 },
      disconnected: { label: 'Disconnected · not publishing', color: '#F2877A', bg: 'rgba(242,135,122,0.12)', bd: 'rgba(242,135,122,0.38)', ringFill: 'none', innerR: 0 }
    };
    const c = C[connId];
    const conn = {
      ...c,
      pillStyle: 'display:inline-flex;align-items:center;gap:6px;height:20px;padding:0 8px;border-radius:10px;font-size:11px;line-height:14px;font-weight:600;color:' + c.color + ';background:' + c.bg + ';border:1px solid ' + c.bd + ';white-space:nowrap;'
    };

    const dim = connId !== 'connected' || !ownerOn;
    const owner = {
      ...o,
      iconStyle: 'flex:0 0 20px;border-radius:4px;' + (o.pixel ? 'image-rendering:pixelated;' : ''),
      largeStyle: 'display:block;width:88px;height:88px;border-radius:8px;object-fit:cover;background:#0A0A0A;' + (o.pixel ? 'image-rendering:pixelated;' : ''),
      smallStyle: 'position:absolute;right:-4px;bottom:-4px;width:28px;height:28px;border-radius:50%;background:#1F1F21;border:3px solid #1F1F21;box-sizing:content-box;' + (o.pixel ? 'image-rendering:pixelated;' : '')
    };

    return {
      providers,
      owner,
      ownerOn,
      ownerOff: !ownerOn,
      hasMetrics: metrics.length > 0,
      noMetrics: metrics.length === 0,
      metrics,
      metricsLabel: o.metricsLabel || '',
      emptyNote: o.emptyNote || '',
      conn,
      cardLabel: 'Discord preview: Playing ' + o.name + '. ' + o.details + '. ' + o.stateLine + '. Elapsed ' + o.elapsed + (dim ? '. Not currently published.' : '.'),
      cardStyle: 'margin:8px 0 0;width:360px;height:182px;padding:12px;border-radius:12px;background:linear-gradient(180deg,#3A3A3C 0%,#1A1A1C 100%);' + (dim ? 'opacity:0.5;' : '')
    };
  }
}

return Component;
})(), {"provider": "codex", "conn": "connected"});
window.__dcMount("Dashboard", document.getElementById('app'));
</script>
